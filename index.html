// --- Calculate Maximum Possible Score dynamically ---
const MAX_SCORE = QUIZ_DATA.reduce((acc, curr) => {
  if (curr.type === 'mc' || curr.type === 'tf') return acc + curr.points;
  if (curr.type === 'match') return acc + (curr.left.length * curr.pointsPerPair);
  if (curr.type === 'checkbox' || curr.type === 'tf_list') return acc + (curr.options.length * curr.pointsPerOption);
  if (curr.type === 'fill') {
    let qCount = 0;
    curr.sections.forEach(s => qCount += s.questions.length);
    return acc + (qCount * curr.pointsPerBlank);
  }
  if (curr.type === 'literacy') return acc + (curr.questions.length * curr.pointsPerQuestion);
  return acc;
}, 0);

function MatchQuestion({ data, questionIndex, onNext, addScore }) {
  const [matches, setMatches] = useState({});
  const [activeLeft, setActiveLeft] = useState(null);
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  
  const containerRef = useRef(null);
  const leftRefs = useRef({});
  const rightRefs = useRef({});
  const [lines, setLines] = useState([]);

  const handleLeftClick = (id) => {
    if (isSubmitted) return;
    setActiveLeft(id === activeLeft ? null : id);
  };

  const handleRightClick = (id) => {
    if (isSubmitted) return;
    if (activeLeft) {
      setMatches(prev => ({ ...prev, [activeLeft]: id }));
      setActiveLeft(null);
      setErrorMsg("");
    }
  };

  const removeMatch = (leftId) => {
    if (isSubmitted) return;
    setMatches(prev => {
      const newM = { ...prev };
      delete newM[leftId];
      return newM;
    });
  };

  const updateLines = useCallback(() => {
    try {
      if (!containerRef.current) return;
      const containerRect = containerRef.current.getBoundingClientRect();
      const newLines = Object.entries(matches).map(([leftId, rightId]) => {
        const leftEl = leftRefs.current[leftId];
        const rightEl = rightRefs.current[rightId];
        if (leftEl && rightEl) {
          const leftRect = leftEl.getBoundingClientRect();
          const rightRect = rightEl.getBoundingClientRect();
          return {
            id: `${leftId}-${rightId}`,
            x1: leftRect.right - containerRect.left,
            y1: leftRect.top + leftRect.height / 2 - containerRect.top,
            x2: rightRect.left - containerRect.left,
            y2: rightRect.top + rightRect.height / 2 - containerRect.top,
            isCorrect: isSubmitted ? data.answers[leftId] === rightId : null,
          };
        }
        return null;
      }).filter(Boolean);
      setLines(newLines);
    } catch (e) {
      console.warn("Line drawing error:", e);
    }
  }, [matches, isSubmitted, data.answers]);

  useEffect(() => {
    updateLines();
    window.addEventListener('resize', updateLines);
    const timer = setTimeout(updateLines, 100);
    return () => {
      window.removeEventListener('resize', updateLines);
      clearTimeout(timer);
    }
  }, [updateLines, matches]);

  const handleSubmit = () => {
    if (Object.keys(matches).length < data.left.length) {
      setErrorMsg("請將所有選項配對完成後再送出喔！");
      return;
    }
    setErrorMsg("");
    setIsSubmitted(true);
    let pts = 0;
    for (const [left, right] of Object.entries(matches)) {
      if (data.answers[left] === right) pts += data.pointsPerPair;
    }
    addScore(pts);
  };

  return (
    <div className="animate-in fade-in duration-300">
      <div className="flex items-center gap-3 text-2xl font-bold text-emerald-800 mb-2">
        <LinkIcon className="w-8 h-8" /> 題型二：{data.title}
      </div>
      <p className="text-gray-600 font-medium mb-6">點擊左邊的項目，再點擊右邊對應的項目進行配對。</p>

      <div className="relative p-2 md:p-6 bg-emerald-50 rounded-2xl border-2 border-emerald-100 overflow-hidden">
        <div ref={containerRef} className="flex justify-between items-stretch relative min-h-[300px]">
          
          <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-10">
            {lines.map(line => (
              <line 
                key={line.id} x1={line.x1} y1={line.y1} x2={line.x2} y2={line.y2} 
                stroke={line.isCorrect === true ? "#10b981" : line.isCorrect === false ? "#ef4444" : "#94a3b8"} 
                strokeWidth="4" 
                strokeDasharray={isSubmitted ? "0" : "6,6"}
                className="transition-all duration-300"
              />
            ))}
          </svg>

          <div className="flex flex-col gap-4 w-[45%] z-20">
            {data.left.map((item) => {
              const isMatched = !!matches[item.id];
              const isActive = activeLeft === item.id;
              let bg = "bg-white border-gray-300 hover:border-emerald-400";
              if (isActive) bg = "bg-emerald-100 border-emerald-500 shadow-md scale-105";
              if (isMatched && !isSubmitted) bg = "bg-blue-50 border-blue-400";
              
              if (isSubmitted) {
                const isCorrect = data.answers[item.id] === matches[item.id];
                bg = isCorrect ? "bg-emerald-50 border-emerald-500" : "bg-red-50 border-red-500";
              }

              return (
                <button
                  key={item.id}
                  ref={el => leftRefs.current[item.id] = el}
                  onClick={() => isMatched ? removeMatch(item.id) : handleLeftClick(item.id)}
                  className={`relative p-3 md:p-4 border-2 rounded-xl text-left font-bold transition-all duration-200 ${bg}`}
                >
                  {item.text}
                </button>
              );
            })}
          </div>

          <div className="flex flex-col gap-4 w-[45%] z-20">
            {data.right.map((item) => {
              const isTargeted = Object.values(matches).includes(item.id);
              let bg = "bg-white border-gray-300 hover:border-emerald-400";
              if (activeLeft) bg += " cursor-pointer animate-pulse border-emerald-300";
              if (isTargeted) bg = "bg-blue-50 border-blue-400 opacity-80 cursor-not-allowed";
              if (isSubmitted) bg = "bg-gray-50 border-gray-300 cursor-default";

              return (
                <div
                  key={item.id}
                  ref={el => rightRefs.current[item.id] = el}
                  onClick={() => !isTargeted && handleRightClick(item.id)}
                  className={`p-3 md:p-4 border-2 rounded-xl text-left font-medium transition-all duration-200 flex items-center ${bg}`}
                >
                  {item.text}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {errorMsg && (
        <div className="mt-4 flex items-center justify-center text-red-500 font-bold gap-2">
          <AlertTriangle className="w-5 h-5" /> {errorMsg}
        </div>
      )}

      {isSubmitted && <TeacherExplanation text={data.explanation} />}

      <div className="flex justify-end pt-6 mt-6 border-t border-gray-100">
        {!isSubmitted ? (
          <button onClick={handleSubmit} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-emerald-600 hover:bg-emerald-500 text-white transform hover:-translate-y-1 transition-all">
            確定答案
          </button>
        ) : (
          <button onClick={onNext} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-blue-600 hover:bg-blue-500 text-white transform hover:-translate-y-1 transition-all flex items-center gap-2">
            下一題 <ArrowRight className="w-5 h-5" />
          </button>
        )}
      </div>
    </div>
  );
}

function FillQuestion({ data, questionIndex, onNext, addScore }) {
  const [answers, setAnswers] = useState({});
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const handleChange = (qId, val) => {
    if (isSubmitted) return;
    setAnswers(prev => ({ ...prev, [qId]: val }));
  };

  const handleSubmit = () => {
    let totalQuestions = 0;
    data.sections.forEach(sec => totalQuestions += sec.questions.length);
    if (Object.keys(answers).length < totalQuestions || Object.values(answers).some(v => !v)) {
      setErrorMsg("請將所有空格填寫完畢後再送出喔！");
      return;
    }
    setErrorMsg("");
    setIsSubmitted(true);
    let pts = 0;
    data.sections.forEach(sec => {
      sec.questions.forEach(q => {
        if (answers[q.id] === q.a) pts += data.pointsPerBlank;
      });
    });
    addScore(pts);
  };

  return (
    <div className="animate-in fade-in duration-300">
      <div className="flex items-center gap-3 text-2xl font-bold text-blue-800 mb-2">
        <Edit className="w-8 h-8" /> 題型三：{data.title}
      </div>
      <p className="text-gray-600 font-medium mb-6">請從下拉選單中，選出最適合的答案填入空格中。</p>

      <div className="space-y-8">
        {data.sections.map((section, sIdx) => (
          <div key={sIdx} className="bg-blue-50/50 p-5 rounded-2xl border-2 border-blue-100">
            <h3 className="font-bold text-lg text-blue-900 mb-4">{section.subtitle}</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {section.questions.map(q => {
                const isCorrect = isSubmitted ? answers[q.id] === q.a : null;
                return (
                  <div key={q.id} className={`flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-xl border-2 transition-colors ${
                    isSubmitted 
                      ? isCorrect ? "bg-emerald-50 border-emerald-200" : "bg-red-50 border-red-200"
                      : "bg-white border-blue-200"
                  }`}>
                    <div className="flex-1 text-gray-800 font-medium">{q.q}</div>
                    <div className="flex items-center gap-3 shrink-0">
                      <select
                        value={answers[q.id] || ""}
                        onChange={(e) => handleChange(q.id, e.target.value)}
                        disabled={isSubmitted}
                        className={`p-2 border-2 rounded-lg font-bold min-w-[120px] shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 ${
                          isSubmitted 
                            ? isCorrect ? "border-emerald-500 text-emerald-700 bg-emerald-50" : "border-red-500 text-red-700 bg-red-50"
                            : "border-gray-300 text-gray-700 bg-white"
                        }`}
                      >
                        <option value="" disabled>請選擇...</option>
                        {section.options.map(opt => (
                          <option key={opt.val} value={opt.val}>{opt.label}</option>
                        ))}
                      </select>
                      {isSubmitted && (isCorrect ? <CheckCircle className="w-5 h-5 text-emerald-500" /> : <XCircle className="w-5 h-5 text-red-500" />)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      {errorMsg && (
        <div className="mt-4 flex items-center justify-center text-red-500 font-bold gap-2">
          <AlertTriangle className="w-5 h-5" /> {errorMsg}
        </div>
      )}

      {isSubmitted && <TeacherExplanation text={data.explanation} />}

      <div className="flex justify-end pt-6 mt-6 border-t border-gray-100">
        {!isSubmitted ? (
          <button onClick={handleSubmit} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-blue-600 hover:bg-blue-500 text-white transform hover:-translate-y-1 transition-all">
            確定答案
          </button>
        ) : (
          <button onClick={onNext} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-emerald-600 hover:bg-emerald-500 text-white transform hover:-translate-y-1 transition-all flex items-center gap-2">
            下一題 <ArrowRight className="w-5 h-5" />
          </button>
        )}
      </div>
    </div>
  );
}

function LiteracyQuestion({ data, questionIndex, onNext, addScore }) {
  const [answers, setAnswers] = useState({});
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const handleChange = (qId, val) => {
    if (isSubmitted) return;
    setAnswers(prev => ({ ...prev, [qId]: val }));
  };

  const handleSubmit = () => {
    if (Object.keys(answers).length < data.questions.length || Object.values(answers).some(v => !v)) {
      setErrorMsg("請將所有題目作答完畢後再送出喔！");
      return;
    }
    setErrorMsg("");
    setIsSubmitted(true);
    let pts = 0;
    data.questions.forEach(q => {
      if (answers[q.id] === q.a) pts += data.pointsPerQuestion;
    });
    addScore(pts);
  };

  return (
    <div className="animate-in fade-in duration-300">
      <div className="flex items-center gap-3 text-2xl font-bold text-purple-800 mb-2">
        <FileText className="w-8 h-8" /> 題型四：{data.title}
      </div>
      <p className="text-gray-600 font-medium mb-6">請仔細閱讀下方的地震報告，並回答相關問題。</p>

      {/* Simulated Earthquake Report */}
      <div className="bg-[#fffdf7] border-4 border-gray-400 p-6 rounded-xl mb-8 shadow-md text-gray-800 font-mono tracking-tight relative overflow-hidden">
         <div className="absolute top-0 right-0 bg-red-600 text-white font-bold px-4 py-1 rounded-bl-xl text-sm">官方發布</div>
         <h3 className="text-center font-extrabold text-2xl mb-4 border-b-2 border-gray-300 pb-3">{data.report.title}</h3>
         <div className="grid grid-cols-1 sm:grid-cols-2 gap-y-3 gap-x-6 text-[1.05rem]">
            <div><span className="font-bold">編號：</span>{data.report.number}</div>
            <div><span className="font-bold">日期：</span>{data.report.date}</div>
            <div><span className="font-bold">時間：</span>{data.report.time}</div>
            <div><span className="font-bold">深度：</span>{data.report.depth}</div>
            <div><span className="font-bold">芮氏規模：</span>{data.report.magnitude}</div>
            <div className="sm:col-span-2"><span className="font-bold">位置：</span>{data.report.location}</div>
         </div>
         <div className="mt-5 pt-4 border-t-2 border-gray-300">
            <div className="font-bold mb-3 text-lg">各地最大震度 (採用109年新制10級震度分級)：</div>
            <div className="flex flex-wrap gap-2">
              {data.report.intensities.map((int, i) => (
                <span key={i} className="bg-gray-200 border border-gray-300 px-3 py-1 rounded-md text-sm font-semibold">{int}</span>
              ))}
            </div>
         </div>
      </div>

      {/* Questions */}
      <div className="space-y-4">
        {data.questions.map(q => {
          const isCorrect = isSubmitted ? answers[q.id] === q.a : null;
          return (
            <div key={q.id} className={`flex flex-col lg:flex-row lg:items-center gap-3 p-4 rounded-xl border-2 transition-colors ${
              isSubmitted 
                ? isCorrect ? "bg-emerald-50 border-emerald-200" : "bg-red-50 border-red-200"
                : "bg-white border-purple-200"
            }`}>
              <div className="flex-1 text-gray-800 font-bold text-lg">{q.q}</div>
              <div className="flex items-center gap-3 shrink-0">
                <select
                  value={answers[q.id] || ""}
                  onChange={(e) => handleChange(q.id, e.target.value)}
                  disabled={isSubmitted}
                  className={`p-2 border-2 rounded-lg font-bold min-w-[200px] max-w-full shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-400 ${
                    isSubmitted 
                      ? isCorrect ? "border-emerald-500 text-emerald-700 bg-emerald-50" : "border-red-500 text-red-700 bg-red-50"
                      : "border-gray-300 text-gray-700 bg-white"
                  }`}
                >
                  <option value="" disabled>請選擇...</option>
                  {q.options.map(opt => (
                    <option key={opt} value={opt}>{opt}</option>
                  ))}
                </select>
                {isSubmitted && (isCorrect ? <CheckCircle className="w-6 h-6 text-emerald-500" /> : <XCircle className="w-6 h-6 text-red-500" />)}
              </div>
            </div>
          );
        })}
      </div>

      {errorMsg && (
        <div className="mt-4 flex items-center justify-center text-red-500 font-bold gap-2">
          <AlertTriangle className="w-5 h-5" /> {errorMsg}
        </div>
      )}

      {isSubmitted && <TeacherExplanation text={data.explanation} />}

      <div className="flex justify-end pt-6 mt-6 border-t border-gray-100">
        {!isSubmitted ? (
          <button onClick={handleSubmit} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-purple-600 hover:bg-purple-500 text-white transform hover:-translate-y-1 transition-all">
            確定答案
          </button>
        ) : (
          <button onClick={onNext} className="px-8 py-3 rounded-full font-bold text-lg shadow-lg bg-emerald-600 hover:bg-emerald-500 text-white transform hover:-translate-y-1 transition-all flex items-center gap-2">
            查看總成績 <Award className="w-5 h-5" />
          </button>
        )}
      </div>
    </div>
  );
}

export default function App() {
  const [currentIndex, setCurrentIndex] = useState(0);
  const [totalScore, setTotalScore] = useState(0);
  const [isFinished, setIsFinished] = useState(false);

  const currentData = QUIZ_DATA[currentIndex];

  const handleScrollToTop = () => {
    try { 
      if (typeof window !== 'undefined' && window.scrollTo) {
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
      }
    } catch (e) {
      console.warn("scrollTo issue caught:", e);
    }
  };

  const handleNext = () => {
    handleScrollToTop();
    if (currentIndex < QUIZ_DATA.length - 1) {
      setCurrentIndex(prev => prev + 1);
    } else {
      setIsFinished(true);
    }
  };

  const addScore = (pts) => {
    setTotalScore(prev => prev + pts);
  };

  const handleRestart = () => {
    setCurrentIndex(0);
    setTotalScore(0);
    setIsFinished(false);
    handleScrollToTop();
  };

  const getRemark = (score) => {
    if (score === MAX_SCORE) return "太神啦！你是自然科學的滿分大師！ 🏆";
    if (score >= MAX_SCORE * 0.8) return "表現非常優異！觀念很清楚喔，繼續保持！ 🌟";
    if (score >= MAX_SCORE * 0.6) return "順利及格囉！有些小地方容易混淆，再複習一下會更棒！ 👍";
    return "沒關係，失敗為成功之母！老師的詳解多看幾次，我們再挑戰一次！ 💪";
  };

  return (
    <div className="min-h-screen bg-[#F0FDF4] font-sans py-8 px-4 flex flex-col items-center overflow-x-hidden">
      <div className="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-emerald-800/10 flex flex-col">
        
        {/* Header */}
        <div className="bg-emerald-700 text-white p-6 relative overflow-hidden shrink-0">
          <div className="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent mix-blend-overlay"></div>
          <div className="flex flex-col md:flex-row items-center justify-between relative z-10">
            <div className="flex items-center gap-4">
              <div className="bg-white p-2 rounded-full">
                <BookOpen className="w-8 h-8 text-emerald-700" />
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-wide">國小自然科學挑戰賽</h1>
            </div>
            {!isFinished && (
              <div className="mt-4 md:mt-0 bg-emerald-800/50 px-4 py-2 rounded-full font-bold border border-emerald-500/50 text-emerald-50 flex items-center gap-2 shadow-inner">
                <span className="text-sm opacity-80">總進度</span>
                <span className="text-lg">{currentIndex + 1} / {QUIZ_DATA.length}</span>
              </div>
            )}
          </div>
        </div>

        {/* Content Area */}
        <div className="p-6 md:p-10 flex-1 bg-white relative">
          {!isFinished ? (
            <div className="min-h-[400px]">
              {currentData.type === 'mc' || currentData.type === 'tf' ? (
                <McTfQuestion 
                  key={currentIndex} 
                  data={currentData} 
                  questionIndex={currentIndex} 
                  onNext={handleNext} 
                  addScore={addScore} 
                />
              ) : currentData.type === 'match' ? (
                <MatchQuestion
                  key={currentIndex}
                  data={currentData}
                  questionIndex={currentIndex}
                  onNext={handleNext}
                  addScore={addScore}
                />
              ) : currentData.type === 'checkbox' ? (
                <CheckboxQuestion
                  key={currentIndex}
                  data={currentData}
                  questionIndex={currentIndex}
                  onNext={handleNext}
                  addScore={addScore}
                />
              ) : currentData.type === 'tf_list' ? (
                <TrueFalseListQuestion
                  key={currentIndex}
                  data={currentData}
                  questionIndex={currentIndex}
                  onNext={handleNext}
                  addScore={addScore}
                />
              ) : currentData.type === 'fill' ? (
                <FillQuestion
                  key={currentIndex}
                  data={currentData}
                  questionIndex={currentIndex}
                  onNext={handleNext}
                  addScore={addScore}
                />
              ) : currentData.type === 'literacy' ? (
                <LiteracyQuestion
                  key={currentIndex}
                  data={currentData}
                  questionIndex={currentIndex}
                  onNext={handleNext}
                  addScore={addScore}
                />
              ) : null}
            </div>
          ) : (
            /* Result Screen */
            <div className="text-center py-10 animate-in zoom-in-95 duration-500">
              <div className="mb-6 relative inline-block">
                <div className="absolute inset-0 bg-yellow-300 rounded-full blur-xl opacity-50 animate-pulse"></div>
                <div className="w-32 h-32 bg-emerald-100 rounded-full flex items-center justify-center mx-auto border-4 border-emerald-500 shadow-xl relative z-10">
                  <Award className="w-16 h-16 text-emerald-600" />
                </div>
              </div>
              
              <h2 className="text-4xl font-black text-gray-800 mb-2">測驗完成！</h2>
              <p className="text-gray-500 font-medium mb-6">總分為 {MAX_SCORE} 分</p>

              <div className="text-7xl font-black text-emerald-600 my-6 drop-shadow-md">
                {totalScore} <span className="text-3xl text-gray-500 font-bold">分</span>
              </div>
              
              <div className="bg-yellow-50 border-2 border-yellow-200 p-8 rounded-2xl mb-10 shadow-sm max-w-lg mx-auto">
                <p className="text-2xl font-bold text-yellow-800 leading-relaxed">{getRemark(totalScore)}</p>
              </div>
              
              <button
                onClick={handleRestart}
                className="px-10 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full font-bold text-xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all flex items-center justify-center gap-3 mx-auto"
              >
                <RefreshCw className="w-6 h-6" />
                重新挑戰
              </button>
            </div>
          )}
        </div>
      </div>
      
      <footer className="mt-8 text-emerald-700/60 font-medium text-center">
        <p>持續學習，探索自然科學的奧秘！ 🌿</p>
      </footer>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
