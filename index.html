<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國小自然科學挑戰賽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-[#F0FDF4] min-h-screen text-gray-800 flex flex-col items-center py-8 px-4">

  <!-- 主容器 -->
  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-emerald-800/10 flex flex-col">
    <!-- 頂部標題與進度 -->
    <div class="bg-emerald-700 text-white p-6 relative flex flex-col sm:flex-row justify-between sm:items-center gap-2">
      <div class="flex items-center gap-3">
        <span class="w-3.5 h-3.5 rounded-full bg-emerald-300"></span>
        <h1 class="text-2xl font-black tracking-wide">國小自然科學挑戰賽</h1>
      </div>
      <div id="progress-container" class="bg-emerald-800/60 px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-500/50 text-emerald-50 self-start sm:self-auto">
        <span>總進度：</span>
        <span id="progress-text">1 / 8</span>
      </div>
    </div>

    <!-- 內容區 -->
    <div id="content-area" class="p-6 sm:p-8 min-h-[360px] flex flex-col justify-center">
      <div class="text-center text-emerald-700 font-bold">載入中...</div>
    </div>
  </div>

  <footer class="mt-8 text-emerald-700/70 font-medium text-center text-sm">
    持續學習，探索自然科學的奧秘！ 🌿
  </footer>

  <script>
    const QUIZ_DATA = [
      {
        question: '根據地表物質的顆粒大小，下列哪一個排序是正確的？',
        options: ['礫石 > 土壤 > 沙', '沙 > 礫石 > 土壤', '礫石 > 沙 > 土壤', '土壤 > 沙 > 礫石'],
        answer: '礫石 > 沙 > 土壤',
        explanation: '地表物質依顆粒大小排列為：礫石(最大) > 沙 > 土壤(最細小)。礫石是很粗的石頭，沙子次之，土壤則是非常細緻的微小顆粒喔！'
      },
      {
        question: '下列哪一項行為會對地表造成破壞？',
        options: ['定期清理垃圾', '維護好山林樹木', '做好水土保持', '開挖山坡地'],
        answer: '開挖山坡地',
        explanation: '隨意開挖山坡地會破壞原有的植被和地形，失去植物根部的保護，只要大雨一來，就很容造成水土流失甚至山崩喔！'
      },
      {
        question: '人類大量砍伐樹木，可能引發下列哪一種災害？',
        options: ['森林大火', '土石流', '地震', '颱風'],
        answer: '土石流',
        explanation: '森林裡的樹木根系能夠緊緊抓住土壤，並且涵養水分。大量砍伐樹木會讓山坡地失去保護傘，遇到豪雨時就容易引發可怕的土石流。'
      },
      {
        question: '進行水域環境調查時，下列哪一種做法是不正確的？',
        options: ['望遠鏡、撈網等觀察物品', '單獨跑到水深的地方觀察', '將水生生物放回原處', '注意安全'],
        answer: '單獨跑到水深的地方觀察',
        explanation: '安全第一！進行任何戶外水域調查，絕對不可以單獨行動，更不可以跑到水深不明的危險區域，同行一定要有大人陪同才行！'
      },
      {
        question: '海邊的沙丘在不同時間的樣貌會不一樣，主要是什麼作用造成的？',
        options: ['雨水和風', '雨水和人類', '雨水和小動物', '人類和小動物'],
        answer: '雨水和風',
        explanation: '海邊的地形缺乏遮蔽物，長時間受到海風吹拂以及雨水的沖刷（搬運、堆積作用），沙丘的形狀和位置就會不斷改變。'
      },
      {
        question: '下列哪一種水生動物是利用腹足爬行？',
        options: ['蛙', '蝦', '螺', '鱉'],
        answer: '螺',
        explanation: '螺類或蝸牛等軟體動物，身體底部具有寬廣平坦稱為「腹足」，牠們會分泌黏液，利用腹足的肌肉收縮在物體表面滑行。'
      },
      {
        question: '我們吃的稻米是屬於哪一種類型的水生植物？',
        options: ['浮葉性', '挺水性', '沉水性', '漂浮性'],
        answer: '挺水性',
        explanation: '水稻的根深扎在水底的泥土裡，但它的莖和葉會挺出水面生長，這就是標準的「挺水性」水生植物特徵喔！'
      },
      {
        question: '造成附近海域珊瑚白化的最主要原因是什麼？',
        options: ['農藥滲入土壤造成海域汙染', '工廠排放熱廢水造成海水溫度升高', '河川地開發排放垃圾造成汙染'],
        answer: '工廠排放熱廢水造成海水溫度升高',
        explanation: '珊瑚對生長環境的溫度非常敏感。當海水溫度異常升高時，與珊瑚共生的藻類會離開，導致珊瑚失去色彩變成白色，若情況持續珊瑚就會死亡。'
      }
    ];

    <div class="animate-[fade-in_0.3s_ease-out] zoom-in-95">
  <div class="flex items-center gap-3 text-2xl font-bold text-teal-800 mb-2">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
    多選題：水域環境紀錄項目
  </div>
  <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-2 leading-relaxed flex items-start gap-3">
    <span class="text-teal-700 text-3xl font-black shrink-0">Q2.</span>
    <span class="mt-1">探索水域環境時，紀錄表中須包含哪些項目？</span>
  </h2>
  <div class="mb-6 md:ml-11 inline-block bg-teal-100 text-teal-800 px-4 py-2 rounded-full text-sm font-bold shadow-sm">
    💡 提示：本題為多選題，請點選所有符合條件的選項。
  </div>

  <div class="grid gap-3 mb-8">
    <!-- 狀態：未勾選 (預設) -->
    <button class="text-left p-4 rounded-xl font-medium text-lg transition-all duration-200 flex items-center gap-4 border-2 bg-white text-gray-700 hover:bg-teal-50 hover:border-teal-300">
      <div class="w-8 h-8 rounded-md border-2 flex items-center justify-center shrink-0 transition-colors bg-white border-gray-300"></div>
      <span class="flex-1">(1) 水域類型</span>
    </button>

    <!-- 狀態：已勾選 (作答中) -->
    <button class="text-left p-4 rounded-xl font-medium text-lg transition-all duration-200 flex items-center gap-4 border-2 border-teal-500 bg-teal-100 text-teal-800 shadow-md transform scale-[1.01]">
      <div class="w-8 h-8 rounded-md border-2 flex items-center justify-center shrink-0 transition-colors bg-teal-500 border-teal-500 text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <span class="flex-1">(2) 水質情況</span>
    </button>

    <!-- 狀態：送出後 (漏勾選提示) -->
    <button class="text-left p-4 rounded-xl font-medium text-lg transition-all duration-200 flex items-center gap-4 border-2 border-yellow-400 bg-yellow-50 text-yellow-800 border-dashed">
      <div class="w-8 h-8 rounded-md border-2 flex items-center justify-center shrink-0 transition-colors bg-white border-gray-300"></div>
      <span class="flex-1">(4) 水流速度</span>
      <div class="shrink-0 flex items-center">
         <span class="text-sm font-bold text-yellow-600 bg-yellow-200 px-2 py-1 rounded-md">漏勾選了</span>
      </div>
    </button>
  </div>
</div>
    <div class="animate-[fade-in_0.3s_ease-out] zoom-in-95">
  <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-relaxed flex items-start gap-3">
    <span class="text-indigo-700 text-3xl font-black shrink-0">Q3.</span>
    <span class="mt-1">關於魚適應水中生活的敘述，正確的請選✔，錯誤的請選✕。</span>
  </h2>

  <div class="space-y-4 mb-8">
    <!-- 單一題項：預設狀態 -->
    <div class="p-4 rounded-xl border-2 transition-all flex flex-col md:flex-row md:items-center gap-4 bg-white border-indigo-100">
      <div class="flex-1 text-gray-800 font-medium text-lg leading-relaxed">
        ① 魚的身體外形頭和尾比較粗大，中間軀幹比較細小，可以幫助魚減少在水中的阻力。
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <!-- 尚未點擊的按鈕 -->
        <button class="w-12 h-12 flex items-center justify-center rounded-lg border-2 font-black text-2xl transition-colors bg-gray-50 border-gray-300 text-gray-400 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-500">✔</button>
        <!-- 已點擊選取的按鈕 -->
        <button class="w-12 h-12 flex items-center justify-center rounded-lg border-2 font-black text-2xl transition-colors bg-indigo-500 border-indigo-600 text-white shadow-md">✕</button>
      </div>
    </div>
  </div>
</div>
    <div class="animate-[fade-in_0.3s_ease-out]">
  <div class="flex items-center gap-3 text-2xl font-bold text-emerald-800 mb-2">
    題型二：連連看：生物與適合生存的地表環境
  </div>
  <p class="text-gray-600 font-medium mb-6">點擊左邊的項目，再點擊右邊對應的項目進行配對。</p>

  <div class="relative p-2 md:p-6 bg-emerald-50 rounded-2xl border-2 border-emerald-100 overflow-hidden">
    <div class="flex justify-between items-stretch relative min-h-[300px]" id="match-container">
      
      <!-- 連線 SVG 畫布 (由 JS 操控 x1, y1, x2, y2) -->
      <svg class="absolute top-0 left-0 w-full h-full pointer-events-none z-10">
        <line x1="80" y1="40" x2="300" y2="120" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6,6" class="transition-all duration-300"></line>
      </svg>

      <!-- 左側區域 -->
      <div class="flex flex-col gap-4 w-[45%] z-20">
        <!-- 狀態：未選 -->
        <button class="relative p-3 md:p-4 border-2 rounded-xl text-left font-bold transition-all duration-200 bg-white border-gray-300 hover:border-emerald-400">
          1. 西瓜
        </button>
        <!-- 狀態：點擊選取中 (Pulse) -->
        <button class="relative p-3 md:p-4 border-2 rounded-xl text-left font-bold transition-all duration-200 bg-emerald-100 border-emerald-500 shadow-md scale-105">
          2. 水稻
        </button>
        <!-- 狀態：已配對 -->
        <button class="relative p-3 md:p-4 border-2 rounded-xl text-left font-bold transition-all duration-200 bg-blue-50 border-blue-400">
          3. 螞蟻
        </button>
      </div>

      <!-- 右側區域 -->
      <div class="flex flex-col gap-4 w-[45%] z-20">
        <div class="p-3 md:p-4 border-2 rounded-xl text-left font-medium transition-all duration-200 flex items-center bg-white border-gray-300 hover:border-emerald-400">
          A. 有黏性的溼潤土壤
        </div>
      </div>
    </div>
  </div>
</div>
    <div class="animate-[fade-in_0.3s_ease-out]">
  <div class="flex items-center gap-3 text-2xl font-bold text-blue-800 mb-2">
    題型三：填填看：水量影響、地震應對與動物呼吸
  </div>
  <p class="text-gray-600 font-medium mb-6">請從下拉選單中，選出最適合的答案填入空格中。</p>

  <div class="space-y-8">
    <div class="bg-blue-50/50 p-5 rounded-2xl border-2 border-blue-100">
      <h3 class="font-bold text-lg text-blue-900 mb-4">1. 對著土堆澆水，流水水量的大小會對土堆外表有什麼影響？</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 題項區塊 -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-xl border-2 transition-colors bg-white border-blue-200">
          <div class="flex-1 text-gray-800 font-medium">(1) 澆水的水量小</div>
          <div class="flex items-center gap-3 shrink-0">
            <!-- 預設下拉選單 -->
            <select class="p-2 border-2 rounded-lg font-bold min-w-[120px] shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 border-gray-300 text-gray-700 bg-white">
              <option value="" disabled selected>請選擇...</option>
              <option value="A">甲. 土堆無變化</option>
              <option value="B">乙. 土堆凹陷了</option>
              <option value="C">丙. 土堆凹陷更多</option>
            </select>
          </div>
        </div>

        <!-- 題項區塊 (送出後答對狀態) -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-xl border-2 transition-colors bg-emerald-50 border-emerald-200">
          <div class="flex-1 text-gray-800 font-medium">(2) 澆水的水量大</div>
          <div class="flex items-center gap-3 shrink-0">
            <select disabled class="p-2 border-2 rounded-lg font-bold min-w-[120px] shadow-sm border-emerald-500 text-emerald-700 bg-emerald-50">
              <option value="C" selected>丙. 土堆凹陷更多</option>
            </select>
            <!-- 答對 Icon -->
            <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
    <div class="mt-6 p-5 bg-amber-50 border-2 border-amber-300 rounded-xl shadow-sm animate-[slide-in-from-bottom-2_0.3s_ease-out]">
  <div class="flex items-center gap-3 text-amber-700 font-bold text-xl mb-3 border-b border-amber-200 pb-2">
    <span class="text-3xl">👩‍🏫</span>
    自然老師的詳解區
  </div>
  <div class="space-y-3 text-amber-900 leading-relaxed text-lg whitespace-pre-wrap">
    地表物質依顆粒大小排列為：礫石(最大) > 沙 > 土壤(最細小)。礫石是很粗的石頭，沙子次之，土壤則是非常細緻的微小顆粒喔！
  </div>
</div>
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const container = document.getElementById('content-area');
      const progressContainer = document.getElementById('progress-container');
      const progressText = document.getElementById('progress-text');

      if (!container) return;

      if (currentIndex >= QUIZ_DATA.length) {
        if (progressContainer) progressContainer.style.display = 'none';
        container.innerHTML = `
          <div class="text-center py-6 fade-in">
            <h2 class="text-3xl font-black text-emerald-800 mb-3">🎉 恭喜完成挑戰！</h2>
            <p class="text-lg text-gray-600 mb-6">本次得分：<span class="text-3xl font-extrabold text-emerald-600">${score}</span> / ${QUIZ_DATA.length * 10} 分</p>
            <button onclick="restartQuiz()" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition">
              重新測驗
            </button>
          </div>
        `;
        return;
      }

      if (progressContainer) progressContainer.style.display = 'block';
      if (progressText) progressText.innerText = `${currentIndex + 1} / ${QUIZ_DATA.length}`;

      const q = QUIZ_DATA[currentIndex];
      answered = false;

      const optionsHtml = q.options.map((opt) => `
        <button onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', this)" class="option-btn w-full text-left p-4 my-2 rounded-xl border-2 border-emerald-100 hover:border-emerald-500 hover:bg-emerald-50/70 transition font-medium flex items-center justify-between text-gray-800">
          <span>${opt}</span>
        </button>
      `).join('');

      container.innerHTML = `
        <div class="fade-in">
          <div class="text-xs font-bold text-emerald-600 tracking-wider uppercase mb-1">Question ${currentIndex + 1}</div>
          <h2 class="text-xl font-bold text-gray-800 mb-5 leading-relaxed">${q.question}</h2>
          <div class="flex flex-col">${optionsHtml}</div>
          <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl text-sm leading-relaxed"></div>
          <div class="mt-6 flex justify-end">
            <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">
              下一題 →
            </button>
          </div>
        </div>
      `;
    }

    function checkAnswer(chosen, btn) {
      if (answered) return;
      answered = true;

      const q = QUIZ_DATA[currentIndex];
      const isCorrect = chosen === q.answer;
      const expBox = document.getElementById('explanation-box');
      const nextBtn = document.getElementById('next-btn');

      document.querySelectorAll('.option-btn').forEach(b => b.classList.add('pointer-events-none'));

      if (isCorrect) {
        score += 10;
        btn.classList.remove('border-emerald-100');
        btn.classList.add('bg-emerald-100', 'border-emerald-600', 'text-emerald-900', 'font-bold');
        expBox.className = "mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 block";
        expBox.innerHTML = `<strong>✅ 答對了！</strong><p class="mt-1">${q.explanation}</p>`;
      } else {
        btn.classList.remove('border-emerald-100');
        btn.classList.add('bg-rose-100', 'border-rose-600', 'text-rose-900', 'font-bold');
        expBox.className = "mt-4 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 block";
        expBox.innerHTML = `<strong>❌ 答錯了！正確答案是：${q.answer}</strong><p class="mt-1">${q.explanation}</p>`;
      }

      nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      renderQuestion();
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
